services:
  postgres:
    image: postgres:16
    container_name: jodalmate-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: jodalmate
      POSTGRES_PASSWORD: jodalmate_dev_password
      POSTGRES_DB: jodalmate
    ports:
      - "5432:5432"
    volumes:
      - jodalmate_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jodalmate -d jodalmate"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    container_name: jodalmate-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - jodalmate_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ING-04 검색엔진 — 02-06 checkpoint:decision 확정값(meilisearch, RESEARCH.md 권장안).
  # 단일 바이너리·설정 없이 즉시 구동 가능해 1인 운영 부담이 OpenSearch보다 낮다는 근거로 선택됨.
  meilisearch:
    image: getmeili/meilisearch:v1.10
    container_name: jodalmate-meilisearch
    restart: unless-stopped
    environment:
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:-jodalmate_dev_master_key}
      MEILI_ENV: development
    ports:
      - "7700:7700"
    volumes:
      - jodalmate_meili_data:/meili_data
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:7700/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  jodalmate_postgres_data:
  jodalmate_redis_data:
  jodalmate_meili_data:
